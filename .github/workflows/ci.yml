name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      # 刻意用 playwright-core 自己的 CLI，不是 `npx playwright`：
      # 後者會去 registry 抓 latest 的 playwright，下載的瀏覽器 revision
      # 可能對不上 package-lock 釘住的 playwright-core，executablePath() 就會指向不存在的檔案。
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Resolve Chromium path
        id: chromium
        run: echo "path=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_OUTPUT"
      - name: Smoke tests
        env:
          CHROMIUM: ${{ steps.chromium.outputs.path }}
        run: node tests/smoke.mjs
